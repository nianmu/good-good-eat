# 好大一颗菜 · Nginx 反向代理模板（服务器端）
# 用途：把 80/443 → 127.0.0.1:8000（FastAPI），并为 WebSocket 配置 wss 升级。
# 部署到服务器后：把 <你的域名> 换成实际域名，放到 /etc/nginx/conf.d/goodgoodeat.conf。
# 需先完成：域名 DNS 解析到服务器 IP、ICP 备案、SSL 证书（腾讯云/阿里云免费DV或 Let's Encrypt）。

# HTTP → HTTPS
server {
    listen 80;
    server_name <你的域名>;

    # 微信小程序「服务器域名」校验文件：从公众平台下载放到 /var/www/html/<校验文件名>
    location = /<校验文件名> {
        root /var/www/html;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name <你的域名>;

    # SSL 证书（替换为实际路径；阿里云/腾讯云 DV 证书，或 /etc/letsencrypt/live/...）
    ssl_certificate     /etc/nginx/ssl/<你的域名>.pem;
    ssl_certificate_key /etc/nginx/ssl/<你的域名>.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    # REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
    }

    # WebSocket（小程序 team 房间，必须 wss 升级）
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}