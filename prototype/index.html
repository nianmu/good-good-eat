<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>好大一颗菜 · 原型预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #E8F5E9 0%, #F5F5F5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .hub {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
    }
    .hub__logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #4CAF50, #388E3C);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      margin-bottom: 16px;
      box-shadow: 0 6px 16px rgba(76, 175, 80, 0.35);
    }
    .hub__title { font-size: 22px; font-weight: 700; color: #1A1A1A; }
    .hub__desc { font-size: 13px; color: #666; margin: 6px 0 24px; line-height: 1.6; }
    .pages { display: flex; flex-direction: column; gap: 12px; }
    .page {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: #F7F9F7;
      border: 1px solid #E8F0E8;
      border-radius: 14px;
      text-decoration: none;
      transition: all 0.15s ease-out;
    }
    .page:hover { background: #E8F5E9; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(76, 175, 80, 0.15); }
    .page__icon {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .page__body { flex: 1; }
    .page__name { font-size: 15px; font-weight: 600; color: #1A1A1A; }
    .page__desc { font-size: 12px; color: #999; margin-top: 3px; }
    .page__arrow { color: #BDBDBD; font-size: 20px; }
    .hub__note {
      margin-top: 24px;
      padding: 12px 14px;
      background: #FFF8E1;
      border-radius: 10px;
      font-size: 12px;
      color: #8D6E63;
      line-height: 1.6;
    }
    .chip {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: #E8F5E9;
      color: #388E3C;
      font-size: 11px;
      font-weight: 600;
      margin-left: 8px;
      vertical-align: 2px;
    }
  </style>
</head>
<body>
  <div class="hub">
    <div class="hub__logo">🥬</div>
    <div class="hub__title">好大一颗菜 · 原型预览</div>
    <div class="hub__desc">一期 UI 原型（HTML 模拟器，桌面上模拟 375px 手机屏）。<br>数据为前端 mock，点菜 → 下单 → 查看取餐码，全流程可交互。</div>

    <div class="pages">
      <a class="page" href="pages/menu.html">
        <div class="page__icon" style="background:#E8F5E9">📋</div>
        <div class="page__body">
          <div class="page__name">菜谱（点菜主页）</div>
          <div class="page__desc">分类浏览 · 加减购物车 · 随机点菜 · 下单</div>
        </div>
        <div class="page__arrow">›</div>
      </a>
      <a class="page" href="pages/order-detail.html?id=order-1003">
        <div class="page__icon" style="background:#FFF3E0">📦</div>
        <div class="page__body">
          <div class="page__name">订单详情<span class="chip">含取餐码</span></div>
          <div class="page__desc">状态流转步骤条 · 菜品清单 · 复制订单信息</div>
        </div>
        <div class="page__arrow">›</div>
      </a>
      <a class="page" href="pages/profile.html">
        <div class="page__icon" style="background:#E3F2FD">👤</div>
        <div class="page__body">
          <div class="page__name">我的</div>
          <div class="page__desc">用户信息 · 我的团队 · 功能宫格</div>
        </div>
        <div class="page__arrow">›</div>
      </a>
    </div>

    <div class="hub__note">
      💡 提示：在「菜谱」页点几道菜后点「下单」，会生成一张带取餐码的新订单，可体验完整流程。
      本平台是美食记录与烹饪协作工具，不涉及支付。
    </div>
  </div>
</body>
</html>
